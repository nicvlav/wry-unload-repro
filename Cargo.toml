[package]
name = "wry-unload-repro"
edition = "2024"

# src/lib.rs: guest.dll, which embeds wry.
[lib]
name = "guest"
crate-type = ["cdylib"]

# src/main.rs: the host that loads and unloads it.
[[bin]]
name = "host"
path = "src/main.rs"

[dependencies]
wry = "=0.57.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }
